[tool.black]
line-length = 99
target-version = ['py36', 'py37', 'py38', 'py39', 'py310', 'py311']
exclude = 'crab/python26/functools.py|archive/.*'

[tool.ruff]
# Same as Black.
line-length = 99
indent-width = 4

# Assume Python 3.9
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"process_pr_v2.py" = ["LOG015", "EXE001", "FA100", "BLE001"]
